<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Torrent Stats</title>
  <style>
    /* IINA makes the web view transparent, so the sidebar's own material (Liquid Glass or
       visual effect) shows through. Never paint an opaque page background here. */
    :root {
      color-scheme: light dark;
      --text-main: rgba(0, 0, 0, 0.88);
      --text-muted: rgba(60, 60, 67, 0.62);
      --glass-fill: rgba(255, 255, 255, 0.42);
      --glass-border: rgba(255, 255, 255, 0.65);
      --glass-edge: rgba(0, 0, 0, 0.06);
      --glass-shadow: 0 1px 2px rgba(0, 0, 0, 0.06), 0 6px 18px rgba(0, 0, 0, 0.06);
      --well: rgba(120, 120, 128, 0.14);
      --accent-blue: #007aff;
      --accent-green: #1fb34a;
      --accent-cyan: #0a8fc9;
      --accent-orange: #e08600;
      --radius: 16px;
      --radius-inner: 11px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --text-main: rgba(255, 255, 255, 0.92);
        --text-muted: rgba(235, 235, 245, 0.6);
        --glass-fill: rgba(255, 255, 255, 0.07);
        --glass-border: rgba(255, 255, 255, 0.16);
        --glass-edge: rgba(0, 0, 0, 0.25);
        --glass-shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.18);
        --well: rgba(255, 255, 255, 0.09);
        --accent-blue: #0a84ff;
        --accent-green: #30d158;
        --accent-cyan: #64d2ff;
        --accent-orange: #ff9f0a;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { background: transparent; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
      color: var(--text-main);
      padding: 12px;
      font-size: 13px;
      line-height: 1.4;
      user-select: none;
      -webkit-user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    .card {
      position: relative;
      background: var(--glass-fill);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 12px;
      /* top-lit hairline + soft outer edge gives the glass rim without needing a blur */
      box-shadow:
        inset 0 1px 0 var(--glass-border),
        inset 0 0 0 1px var(--glass-edge),
        var(--glass-shadow);
    }

    .header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .badge {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      padding: 3px 9px;
      border-radius: 999px;
      letter-spacing: 0.5px;
    }
    .badge-streaming { background: color-mix(in srgb, var(--accent-green) 20%, transparent); color: var(--accent-green); }
    .badge-connecting { background: color-mix(in srgb, var(--accent-orange) 20%, transparent); color: var(--accent-orange); }
    .badge-idle { background: var(--well); color: var(--text-muted); }

    .torrent-title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 4px;
      word-break: break-word;
    }

    .speed-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin: 12px 0;
    }

    .speed-box {
      background: var(--well);
      border-radius: var(--radius-inner);
      padding: 9px 11px;
      display: flex;
      flex-direction: column;
    }

    .speed-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .speed-val {
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .speed-down { color: var(--accent-cyan); }
    .speed-up { color: var(--accent-green); }

    .progress-bar-container {
      width: 100%;
      height: 6px;
      background: var(--well);
      border-radius: 999px;
      overflow: hidden;
      margin: 8px 0 6px 0;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-cyan), var(--accent-green));
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      color: var(--text-muted);
      font-size: 11px;
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    .storage-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 500;
      padding: 6px 10px;
      border-radius: var(--radius-inner);
      background: color-mix(in srgb, var(--accent-cyan) 14%, transparent);
      color: var(--accent-cyan);
      margin-top: 10px;
    }

    .icon { width: 14px; height: 14px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

    .btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--accent-blue);
      color: #ffffff;
      border: none;
      padding: 9px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 12px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.28), 0 1px 3px rgba(0, 0, 0, 0.18);
      transition: filter 0.15s ease, transform 0.05s ease;
    }
    .btn:hover { filter: brightness(1.08); }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.5; cursor: default; filter: none; }

    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-muted);
    }
    .empty-icon { width: 34px; height: 34px; margin: 0 auto 10px; display: block; color: var(--text-muted); stroke-width: 1.5; }
    .empty-state code {
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 11px;
      background: var(--well);
      padding: 1px 5px;
      border-radius: 5px;
    }
  </style>
</head>
<body>

  <div id="active-card" class="card" style="display: none;">
    <div class="header-row">
      <span id="status-badge" class="badge badge-streaming">Streaming</span>
      <span id="peers-count" style="font-size: 11px; color: var(--text-muted);">0 peers</span>
    </div>

    <div id="torrent-name" class="torrent-title">Streaming Torrent</div>

    <div class="speed-grid">
      <div class="speed-box">
        <span class="speed-label">Download</span>
        <span id="speed-down" class="speed-val speed-down">0.0 MB/s</span>
      </div>
      <div class="speed-box">
        <span class="speed-label">Upload</span>
        <span id="speed-up" class="speed-val speed-up">0.0 KB/s</span>
      </div>
    </div>

    <div class="progress-bar-container">
      <div id="progress-fill" class="progress-bar-fill"></div>
    </div>

    <div class="stats-row">
      <span id="progress-pct">0%</span>
      <span id="bytes-ratio">0 MB / 0 MB</span>
    </div>

    <div id="storage-indicator" class="storage-pill">
      <svg class="icon" viewBox="0 0 24 24"><path d="M13 2 4 14h7l-1 8 9-12h-7z"/></svg>
      <span id="storage-text">RAM Ring Buffer (Zero SSD Wear)</span>
    </div>

    <button id="btn-keep" class="btn">
      <svg class="icon" viewBox="0 0 24 24"><path d="M12 3v12m0 0-4-4m4 4 4-4M5 21h14"/></svg>
      <span id="btn-keep-text">Keep File to ~/Videos</span>
    </button>
  </div>

  <div id="empty-card" class="card empty-state">
    <svg class="icon empty-icon" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m10 9.5 4.5 2.5-4.5 2.5z"/></svg>
    <div style="font-weight: 600; margin-bottom: 4px; color: var(--text-main);">Ready to Stream</div>
    <div style="font-size: 12px; line-height: 1.4;">
      Drag any <code>.torrent</code> file into IINA, open a magnet link, or stream with 1-click from your browser.
    </div>
  </div>

  <script>
    function formatBytes(bytes) {
      if (!bytes || bytes <= 0) return "0 B";
      const units = ["B", "KB", "MB", "GB", "TB"];
      let i = 0;
      let val = bytes;
      while (val >= 1024 && i < units.length - 1) {
        val /= 1024;
        i++;
      }
      return `${val.toFixed(1)} ${units[i]}`;
    }

    function formatSpeed(bytesPerSec) {
      return `${formatBytes(bytesPerSec)}/s`;
    }

    const activeCard = document.getElementById("active-card");
    const emptyCard = document.getElementById("empty-card");
    const statusBadge = document.getElementById("status-badge");
    const torrentName = document.getElementById("torrent-name");
    const peersCount = document.getElementById("peers-count");
    const speedDown = document.getElementById("speed-down");
    const speedUp = document.getElementById("speed-up");
    const progressFill = document.getElementById("progress-fill");
    const progressPct = document.getElementById("progress-pct");
    const bytesRatio = document.getElementById("bytes-ratio");
    const storageText = document.getElementById("storage-text");
    const btnKeep = document.getElementById("btn-keep");
    const btnKeepText = document.getElementById("btn-keep-text");

    btnKeep.addEventListener("click", () => {
      btnKeep.disabled = true;
      btnKeepText.innerText = "Requesting Keep…";
      iina.postMessage("keep", {});
    });

    iina.onMessage("stats", (stats) => {
      if (!stats || !stats.name) {
        activeCard.style.display = "none";
        emptyCard.style.display = "block";
        return;
      }

      emptyCard.style.display = "none";
      activeCard.style.display = "block";

      torrentName.innerText = stats.name || "Torrent Stream";
      peersCount.innerText = `${stats.peers || 0} peers (${stats.active_peers || 0} active)`;
      speedDown.innerText = formatSpeed(stats.download_speed || 0);
      speedUp.innerText = formatSpeed(stats.upload_speed || 0);

      const pct = (stats.progress || 0).toFixed(1);
      progressPct.innerText = `${pct}%`;
      progressFill.style.width = `${pct}%`;

      const doneStr = formatBytes(stats.completed_bytes || 0);
      const totalStr = formatBytes(stats.total_bytes || 0);
      bytesRatio.innerText = `${doneStr} / ${totalStr}`;

      if (stats.storage_mode === "ram") {
        const usedRam = formatBytes(stats.ram_used_bytes || 0);
        const maxRam = formatBytes(stats.ram_max_bytes || 0);
        storageText.innerText = `RAM Ring Buffer: ${usedRam} / ${maxRam} (Zero SSD Wear)`;
      } else {
        storageText.innerText = "Storage: Disk Cache";
      }

      if (stats.keep_active) {
        btnKeep.disabled = true;
        btnKeepText.innerText = `Saving to disk… (${(stats.keep_progress || 0).toFixed(1)}%)`;
      } else {
        btnKeep.disabled = false;
        btnKeepText.innerText = "Keep File to ~/Videos";
      }
    });

    // Request immediate stats on tab focus
    iina.postMessage("poll", {});
  </script>
</body>
</html>
